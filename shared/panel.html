<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="bar">
  <div class="ctx">
    <img id="favicon" class="favicon" alt="">
    <div class="ctx-text">
      <div class="page-title" id="pageTitle">—</div>
      <div class="ctx-sub">
        <span class="page-host" id="pageHost"></span>
        <span class="status" id="status" role="status"><i class="dot"></i><span id="statusText"></span></span>
        <span class="tools-state off" id="toolsState"></span>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="noteToggle" title="Notes on the Hermes host" aria-label="Notes">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    </button>
    <button class="icon-btn" id="clear" title="New conversation" aria-label="New conversation">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<section id="noteView" class="note-view" hidden>
  <div class="note-bar">
    <button class="note-open" id="noteOpen" title="Open a note">Open note…</button>
    <span class="note-path" id="notePath">No note open</span>
    <span class="note-presence" id="notePresence"></span>
    <span class="note-status" id="noteStatus"></span>
  </div>
  <div class="note-tools">
    <button id="noteAsk" disabled title="Ask Hermes about the selected text (Ctrl+/)">Ask about selection</button>
    <button id="notePreviewBtn" title="Show the note rendered">Preview</button>
    <button id="noteTab" title="Open this note in a full tab">Open in tab ↗</button>
  </div>
  <div class="note-ask" id="noteAskBox" hidden>
    <span id="noteAskWhat"></span>
    <input id="noteAskInput" placeholder="What should Hermes do with it?" spellcheck="true">
    <button id="noteAskSend">Send</button><button id="noteAskCancel">Cancel</button>
  </div>
  <div class="note-banner busy" id="noteLock" hidden><span>Hermes is working on<span id="noteLockWho"></span> <b id="noteLockText"></b></span>
    <button id="noteStop">Stop</button></div>
  <div class="note-banner bad" id="noteConflict" hidden>This note changed elsewhere and the edits overlap.
    <button id="noteTheirs">Use theirs</button><button id="noteMine">Keep mine</button></div>
  <div class="note-banner ok" id="noteResult" hidden><span id="noteResultText"></span>
    <button id="noteUndo">Undo Hermes's change</button><button id="noteKeep">Keep</button></div>
  <div id="notePrompts" class="note-prompts"></div>
  <div id="noteEditor" class="note-editor"></div>
  <div id="notePreview" class="note-preview body" hidden></div>
  <div id="notePicker" class="note-picker" hidden>
    <input id="notePickQuery" placeholder="Search notes…" spellcheck="false">
    <ul id="notePickList"></ul>
  </div>
</section>

<main id="log" aria-live="polite">
  <div class="empty" id="empty">
    <img src="icons/icon-128.png" alt="" class="empty-logo">
    <h2>Ask about this page</h2>
    <p>Hermes can see which tab you're on and reads it when it needs to. Anything you've selected is sent with your question.</p>
    <div class="chips">
      <button class="chip" data-q="Summarise this page in a few bullet points.">Summarise</button>
      <button class="chip" data-q="What are the key takeaways here?">Key takeaways</button>
      <button class="chip" data-q="Explain the selected text in plain language.">Explain selection</button>
      <button class="chip" data-q="What's missing or questionable in this page's argument?">Critique</button>
    </div>
  </div>
</main>

<form id="f" class="composer">
  <div class="input-wrap">
    <textarea id="q" rows="1" placeholder="Ask Hermes…" autofocus></textarea>
    <button type="submit" id="send" class="send" title="Send (Enter)" aria-label="Send">
      <svg class="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    </button>
  </div>
  <div class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>Esc</kbd> stop</div>
</form>

<script src="api-shim.js"></script>
<script src="platform.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="markdown.js"></script>
<script src="vendor/arcjet-redact.js"></script>
<script src="vendor/compromise.js"></script>
<script src="redactor.js"></script>
<script src="vendor/editor.js"></script>
<script src="notebook.js"></script>
<script src="outrigger.js"></script>
<script src="prompts.js"></script>
<script src="browser-tools.js"></script>
<script src="panel.js"></script>
</body>
</html>
