<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Hermes Sidebar — Settings</title>
<link rel="stylesheet" href="panel.css">
<style>
  body{display:block;height:auto;min-height:100vh;padding:48px 20px}
  .card{max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .head img{width:40px;height:40px;border-radius:11px}
  .head h1{margin:0;font-size:18px;font-weight:650}
  .head p{margin:0;color:var(--muted);font-size:12.5px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
  .field small{display:block;color:var(--faint);font-size:11.5px;margin-top:4px}
  .row{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;transition:border-color .15s,box-shadow .15s}
  .row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:9px 11px}
  .row input#key{font-family:var(--mono);font-size:13px}
  .footer{display:flex;align-items:center;gap:8px;margin-top:22px}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent-2)}
  #st{font-size:12.5px;margin-left:auto;color:var(--muted)}
  #st.ok{color:var(--ok)} #st.bad{color:var(--err-ink)}
  code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:0 .3em}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img src="icons/icon-128.png" alt="">
    <div><h1>Hermes Sidebar</h1><p>Connect the sidebar to your local Hermes gateway.</p></div>
  </div>
  <div class="field">
    <label for="endpoint">Endpoint</label>
    <div class="row"><input id="endpoint" placeholder="http://127.0.0.1:8642" spellcheck="false"></div>
  </div>
  <div class="field">
    <label for="key">API key</label>
    <div class="row">
      <input id="key" type="password" spellcheck="false" autocomplete="off">
      <button class="icon-btn" id="reveal" type="button" title="Show / hide" aria-label="Show or hide key">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <small><code>API_SERVER_KEY</code> from <code>~/.hermes/.env</code></small>
  </div>
  <div class="footer">
    <button class="btn primary" id="save">Save</button>
    <button class="btn" id="test">Test connection</button>
    <span id="st"></span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
